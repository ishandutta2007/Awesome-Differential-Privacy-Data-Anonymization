<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .code-symbol {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 24px;
      fill: #38bdf8;
      opacity: 0.4;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Dynamic Cyber Grid -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Animated Ambient Floating Orbs in Background -->
  <g opacity="0.45" filter="url(#orbGlow)">
    <circle cx="200" cy="120" r="100" fill="#0284c7">
      <animate attributeName="cx" values="200;260;180;200" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;180;100;120" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="280" r="120" fill="#7c3aed">
      <animate attributeName="cx" values="1020;960;1060;1020" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="280;220;300;280" dur="13s" repeatCount="indefinite" />
    </circle>
    <circle cx="620" cy="380" r="90" fill="#06b6d4">
      <animate attributeName="cy" values="380;320;390;380" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Mathematical & Privacy Glyphs (Background Dynamics) -->
  <g class="code-symbol">
    <text x="120" y="80">ε (Epsilon)</text>
    <text x="1000" y="90">δ (Delta)</text>
    <text x="140" y="360">Laplace(b)</text>
    <text x="960" y="370">DP-SGD(σ)</text>
    <text x="70" y="220">k-Anonymity</text>
  </g>

  <!-- Animated Data Flow Rays -->
  <g stroke-linecap="round" opacity="0.25">
    <line x1="100" y1="50" x2="1100" y2="50" stroke="#38bdf8" stroke-dasharray="8 16" stroke-width="1.5">
      <animate attributeName="stroke-dashoffset" values="0;-120" dur="6s" repeatCount="indefinite" />
    </line>
    <line x1="50" y1="390" x2="1150" y2="390" stroke="#818cf8" stroke-dasharray="10 20" stroke-width="1.5">
      <animate attributeName="stroke-dashoffset" values="0;150" dur="7s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Foreground Shield / Privacy Vault Icon -->
  <g transform="translate(600, 92)">
    <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
    </circle>
    <!-- Privacy Shield Icon -->
    <path d="M 0 -22 L 20 -12 C 20 12 10 24 0 28 C -10 24 -20 12 -20 -12 Z" fill="url(#shieldGrad)" />
    <!-- Keyhole -->
    <circle cx="0" cy="1" r="4" fill="#0f172a" />
    <path d="M -2 2 L 2 2 L 3 10 L -3 10 Z" fill="#0f172a" />
  </g>

  <!-- FOREGROUND TEXT (Always crisp, prominent and clear) -->
  <g text-anchor="middle">
    <!-- Category Tagline -->
    <text x="600" y="174" class="tagline-text">🔒 Privacy-Preserving Computing &amp; Synthetic Data Vault</text>

    <!-- Main Repository Title -->
    <text x="600" y="228" class="title-text" fill="url(#titleGrad)">Awesome Differential Privacy &amp; Data Anonymization</text>

    <!-- Subtitle -->
    <text x="600" y="268" class="subtitle-text">Curated SaaS Platforms, Production DP Libraries, PII Redaction &amp; Synthetic Data Generators</text>
  </g>

  <!-- Feature / Topic Pills (Foreground) -->
  <g transform="translate(195, 308)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <text x="90" y="24" text-anchor="middle" class="pill-text">⚡ Differential Privacy</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(198, 0)">
      <rect width="186" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <text x="93" y="24" text-anchor="middle" class="pill-text">🎭 Data Anonymization</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(402, 0)">
      <rect width="194" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
      <text x="97" y="24" text-anchor="middle" class="pill-text">🧬 Synthetic Data (AI)</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(614, 0)">
      <rect width="196" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
      <text x="98" y="24" text-anchor="middle" class="pill-text">🛡️ PII Masking &amp; PETs</text>
    </g>
  </g>
</svg>
